# Checks the notepad, then publishes it to GitHub Pages.
#
# The deploy waits on the test job, so a broken build cannot reach the
# live site. Pages itself has to be switched on once by hand at
# Settings > Pages > Source: GitHub Actions — a workflow token is not
# allowed to do that — and until it is, the deploy job says so and stops
# rather than failing.
name: Pages

on:
  push:
    branches: ["claude/thinkpad-notepad-app-k4013w"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Rebuild the single-file copy
        run: npm run build

      - name: Fail if dist is out of date
        run: git diff --exit-code -- dist/

      - name: Test
        run: npm test

  deploy:
    name: Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages is not switched on yet
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages is off::Settings > Pages > Source: GitHub Actions, then re-run this workflow."
          echo "Pages is not enabled for this repository, so there is nowhere to deploy to."
          echo "The workflow token was not allowed to switch it on by itself."
          echo "Enable it once here: https://github.com/${{ github.repository }}/settings/pages"
          echo "Source: GitHub Actions. Then re-run this workflow and the site goes up."

      - name: Upload the site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
