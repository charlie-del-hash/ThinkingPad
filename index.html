<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThinkPad Notes</title>
<meta name="description" content="A skeuomorphic plain-text notepad in the shape of an early-2000s IBM ThinkPad.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231d1f23'/%3E%3Crect x='5' y='8' width='22' height='14' rx='1' fill='%23cfd8d0'/%3E%3Ccircle cx='16' cy='26' r='2.5' fill='%23d21f3c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/chassis.css">
<link rel="stylesheet" href="css/notepad.css">
<link rel="stylesheet" href="css/themes.css">
</head>
<body class="font-period">

<div class="desk" id="desk">
  <div class="room-light" aria-hidden="true"></div>

  <div class="machine" id="machine">

    <!-- ============ LID ============ -->
    <div class="lid">
      <div class="lid-latches" aria-hidden="true"><i></i><i></i></div>
      <div class="bezel">
        <div class="bezel-top">
          <button type="button" class="thinklight" id="thinklightBtn" title="ThinkLight (Fn+PgUp)" aria-label="ThinkLight">
            <span class="bulb" aria-hidden="true"></span>
          </button>
        </div>

        <div class="screen">
          <span class="bumper tl" aria-hidden="true"></span>
          <span class="bumper tr" aria-hidden="true"></span>
          <span class="bumper bl" aria-hidden="true"></span>
          <span class="bumper br" aria-hidden="true"></span>

          <div class="lcd" id="lcd">
            <div class="lcd-inner" id="lcdInner">

              <!-- ============ THE SOFTWARE ============ -->
              <div class="win" id="win">
                <div class="titlebar" id="titlebar">
                  <span class="app-icon" aria-hidden="true"></span>
                  <span class="title" id="winTitle">Untitled - ThinkPad Notes</span>
                  <span class="tb-buttons">
                    <button type="button" class="tb" id="tbMin" title="Minimise (Standby)" aria-label="Standby"><b class="g-min"></b></button>
                    <button type="button" class="tb" id="tbMax" title="Toggle note list" aria-label="Toggle note list"><b class="g-max"></b></button>
                    <button type="button" class="tb" id="tbClose" title="Close lid (Standby)" aria-label="Standby"><b class="g-close"></b></button>
                  </span>
                </div>

                <div class="menubar" id="menubar" role="menubar"></div>

                <div class="workspace" id="workspace">
                  <div class="pane pane-notes" id="paneNotes">
                    <div class="find">
                      <label for="search">F<u>i</u>nd:</label>
                      <input type="text" id="search" spellcheck="false" autocomplete="off"
                             placeholder="" aria-describedby="findCount">
                      <span class="find-count" id="findCount" aria-live="polite"></span>
                    </div>
                    <div class="listbox" id="listbox" role="listbox" tabindex="0" aria-label="Notes"></div>
                    <div class="pane-foot">
                      <button type="button" class="btn" id="btnNew">New</button>
                      <button type="button" class="btn" id="btnDelete">Delete</button>
                    </div>
                  </div>

                  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

                  <div class="pane pane-editor">
                    <div class="editor-wrap">
                      <div class="editor-underlay" id="editorUnderlay" aria-hidden="true"></div>
                      <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
                                aria-label="Note text" placeholder=""></textarea>
                    </div>
                  </div>
                </div>

                <div class="statusbar">
                  <span class="cell grow" id="stMsg" role="status" aria-live="polite">Ready</span>
                  <span class="cell" id="stPos">Ln 1, Col 1</span>
                  <span class="cell" id="stCount">0 words</span>
                  <span class="cell click" id="stFont" title="Click to switch typeface">Courier New</span>
                </div>
              </div>
              <!-- ============ /THE SOFTWARE ============ -->

            </div>
            <div class="lcd-grain" aria-hidden="true"></div>
            <div class="lcd-glare" aria-hidden="true"></div>
            <div class="lcd-dark" id="lcdDark" aria-hidden="true"></div>
          </div>
        </div>

        <div class="bezel-foot">
          <div class="ibm-logo" aria-label="IBM"><span>IBM</span></div>
          <div class="leds" id="leds">
            <span class="led-cell" title="Power">
              <i class="led led-pwr on"></i>
              <svg class="ico" viewBox="0 0 12 12" role="img" aria-label="Power">
                <path d="M3.6 3.1a4 4 0 1 0 4.8 0"/><path d="M6 1v4.2"/>
              </svg>
            </span>
            <span class="led-cell" title="Battery">
              <i class="led led-bat on"></i>
              <svg class="ico" viewBox="0 0 12 12" role="img" aria-label="Battery">
                <rect x="1" y="3.6" width="8.6" height="4.8" rx=".7"/>
                <path d="M10.4 5.1v1.8" stroke-width="1.6"/>
                <path d="M2.6 6h3.2" stroke-width="1.6"/>
              </svg>
            </span>
            <span class="led-cell" title="Standby">
              <i class="led led-slp"></i>
              <svg class="ico" viewBox="0 0 12 12" role="img" aria-label="Standby">
                <path d="M8.9 7.7A4.1 4.1 0 1 1 6.1 1.4a3.3 3.3 0 0 0 2.8 6.3z"/>
              </svg>
            </span>
            <span class="led-cell" title="Drive in use">
              <i class="led led-hdd"></i>
              <svg class="ico" viewBox="0 0 12 12" role="img" aria-label="Drive in use">
                <path d="M2.2 3.4v5.2c0 .8 1.7 1.4 3.8 1.4s3.8-.6 3.8-1.4V3.4"/>
                <ellipse cx="6" cy="3.4" rx="3.8" ry="1.4"/>
              </svg>
            </span>
            <span class="led-cell" title="Num Lock">
              <i class="led led-num"></i>
              <svg class="ico" viewBox="0 0 12 12" role="img" aria-label="Num Lock">
                <rect x="1.4" y="1.8" width="9.2" height="8.4" rx="1.2"/>
                <path d="M5.1 4.9 6.2 4v4.1"/><path d="M4.9 8.1h2.6"/>
              </svg>
            </span>
            <span class="led-cell" title="Caps Lock">
              <i class="led led-cap"></i>
              <svg class="ico" viewBox="0 0 12 12" role="img" aria-label="Caps Lock">
                <rect x="1.4" y="1.8" width="9.2" height="8.4" rx="1.2"/>
                <path d="M4.3 8.4 6 3.7l1.7 4.7"/><path d="M4.9 6.9h2.2"/>
              </svg>
            </span>
          </div>
          <div class="tp-logo" aria-label="ThinkPad">Th<span class="i">ı<b></b></span>nkPad</div>
        </div>
      </div>
    </div>

    <!-- ============ HINGES ============ -->
    <div class="hinges" aria-hidden="true">
      <i class="hinge"></i>
      <div class="hinge-gap"></div>
      <i class="hinge"></i>
    </div>

    <!-- ============ BASE ============ -->
    <div class="base">
      <div class="topdeck">
        <button type="button" class="access-ibm" id="accessBtn" title="Access IBM — help &amp; shortcuts">Access IBM</button>
        <div class="drilled" aria-hidden="true"></div>
        <div class="hw-buttons">
          <button type="button" class="hwb" id="volDown" title="Volume down (key click)">&minus;</button>
          <button type="button" class="hwb" id="volUp" title="Volume up (key click)">+</button>
          <button type="button" class="hwb" id="volMute" title="Mute key click"><span class="mute-led"></span>&#9679;</button>
          <button type="button" class="power" id="powerBtn" title="Standby"><span class="ring"></span></button>
        </div>
      </div>

      <div class="keyboard" id="keyboard">
        <div class="trackpoint" id="trackpoint" title="TrackPoint — drag to scroll" role="button" tabindex="0" aria-label="TrackPoint scroller"></div>
      </div>

      <div class="palmrest">
        <div class="tp-buttons" aria-hidden="false">
          <button type="button" class="tpb left" id="tpbLeft" title="Previous note"></button>
          <button type="button" class="tpb center" id="tpbCenter" title="Scroll lock — drag the TrackPoint"></button>
          <button type="button" class="tpb right" id="tpbRight" title="Next note"></button>
        </div>
        <div class="badge" aria-hidden="true">
          <span class="badge-plate">ThinkPad</span>
        </div>
      </div>
      <div class="front-lip" aria-hidden="true"><i class="latch-slot"></i><i class="latch-slot"></i></div>
    </div>

  </div>

  <p class="footnote">
    Everything you type is stored in this browser only (localStorage). An unaffiliated homage — no connection to IBM or Lenovo.
  </p>
</div>

<div class="modal-layer" id="modalLayer" hidden></div>
<div class="print-sheet" id="printSheet" aria-hidden="true"></div>
<input type="file" id="fileInput" accept=".txt,.md,.json,text/plain,application/json" hidden>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/settings.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/machine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
